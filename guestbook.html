<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>광성흥업 - GUESTBOOK</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="banner">
    <span class="title">광 성 흥 업</span>
    <span class="subtitle">~ GUESTBOOK ~</span>
  </div>

  <div class="navbar">
    <a href="index.html">HOME</a>
    <a href="members.html">ROSTER</a>
    <a href="music.html">MUSIC</a>
    <a href="guestbook.html">GUESTBOOK</a>
    <a href="mailto:webmaster@gwangsung.co">CONTACT</a>
  </div>

  <h1>✎ 방 명 록 ✎</h1>

  <div class="bevel-out">
    <p>
      광성흥업을 찾아주신 분들의 한 마디입니다.
      아래 양식에 닉네임과 메시지를 남겨주세요!
    </p>
  </div>

  <hr class="fancy">

  <h2>★ 글 남기기 ★</h2>

  <form id="gb-form" class="bevel-in" autocomplete="off">
    <table cellpadding="6" cellspacing="0" style="width:100%;">
      <tr>
        <td width="100"><b>닉네임:</b></td>
        <td><input type="text" id="gb-nickname" name="nickname" maxlength="30" size="30" required style="font-family:'Courier New',monospace;font-size:13px;padding:3px;"></td>
      </tr>
      <tr>
        <td valign="top"><b>메시지:</b></td>
        <td><textarea id="gb-message" name="message" maxlength="500" rows="4" cols="50" required style="font-family:'Courier New',monospace;font-size:13px;padding:3px;width:90%;"></textarea></td>
      </tr>
      <!-- honeypot -->
      <tr style="position:absolute;left:-9999px;" aria-hidden="true">
        <td><label>Website</label></td>
        <td><input type="text" name="website" tabindex="-1" autocomplete="off"></td>
      </tr>
      <tr>
        <td></td>
        <td>
          <button type="submit" id="gb-submit" style="font-family:'Times New Roman',serif;font-size:14px;padding:4px 16px;background-color:#c0c0c0;border-top:2px solid #ffffff;border-left:2px solid #ffffff;border-right:2px solid #808080;border-bottom:2px solid #808080;cursor:pointer;font-weight:bold;">
            [ 작 성 ]
          </button>
          <span id="gb-status" style="margin-left:12px;font-size:12px;"></span>
        </td>
      </tr>
    </table>
  </form>

  <hr class="fancy">

  <h2>★ 방문자들의 한 마디 ★</h2>

  <div id="gb-entries" class="bevel-in" style="background-color:#ffffff;min-height:120px;">
    <p style="text-align:center;color:#808080;font-style:italic;">방명록을 불러오는 중...</p>
  </div>

  <hr class="fancy">

  <center>
    <span class="under-construction">✉ 욕설 / 광고는 예고 없이 삭제됩니다 ✉</span>
  </center>

  <div class="footer">
    <p>
      <a href="index.html">[ &lt;&lt; HOME으로 돌아가기 ]</a>
    </p>
    <p>
      &copy; 1996-2026 광성흥업. All rights reserved.
    </p>
  </div>

  <script>
    const entriesEl = document.getElementById("gb-entries");
    const form = document.getElementById("gb-form");
    const statusEl = document.getElementById("gb-status");
    const submitBtn = document.getElementById("gb-submit");

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function formatDate(iso) {
      const d = new Date(iso);
      if (isNaN(d)) return "";
      const yyyy = d.getFullYear();
      const mm = String(d.getMonth() + 1).padStart(2, "0");
      const dd = String(d.getDate()).padStart(2, "0");
      const hh = String(d.getHours()).padStart(2, "0");
      const mi = String(d.getMinutes()).padStart(2, "0");
      return `${yyyy}.${mm}.${dd} ${hh}:${mi}`;
    }

    async function loadEntries() {
      try {
        const res = await fetch("/api/guestbook", { cache: "no-store" });
        if (!res.ok) throw new Error("불러오기 실패");
        const data = await res.json();
        renderEntries(data.entries || []);
      } catch (err) {
        entriesEl.innerHTML = '<p style="color:#aa0000;text-align:center;">방명록을 불러올 수 없습니다. 잠시 후 다시 시도해주세요.</p>';
      }
    }

    function renderEntries(entries) {
      if (entries.length === 0) {
        entriesEl.innerHTML = '<p style="text-align:center;color:#808080;font-style:italic;">아직 방명록이 비어 있습니다. 첫 방문자가 되어주세요!</p>';
        return;
      }
      const total = entries.length;
      const html = entries.map((e, i) => {
        const num = String(total - i).padStart(2, "0");
        const nick = escapeHtml(e.nickname || "익명");
        const msg = escapeHtml(e.message || "").replace(/\n/g, "<br>");
        const when = formatDate(e.at);
        return `
          <p>
            <b>[${num}] ${nick}</b> &mdash; <small>${when}</small><br>
            ${msg}
          </p>
          <hr>
        `;
      }).join("");
      entriesEl.innerHTML = html;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const nickname = document.getElementById("gb-nickname").value.trim();
      const message = document.getElementById("gb-message").value.trim();
      const website = form.querySelector('input[name="website"]').value;

      if (!nickname || !message) {
        statusEl.textContent = "닉네임과 메시지를 모두 입력해주세요.";
        statusEl.style.color = "#aa0000";
        return;
      }

      submitBtn.disabled = true;
      statusEl.textContent = "전송 중...";
      statusEl.style.color = "#000080";

      try {
        const res = await fetch("/api/guestbook", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ nickname, message, website }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "전송 실패");
        statusEl.textContent = "★ 등록 완료! ★";
        statusEl.style.color = "#008000";
        document.getElementById("gb-message").value = "";
        await loadEntries();
      } catch (err) {
        statusEl.textContent = err.message || "전송 실패";
        statusEl.style.color = "#aa0000";
      } finally {
        submitBtn.disabled = false;
        setTimeout(() => { statusEl.textContent = ""; }, 4000);
      }
    });

    loadEntries();
  </script>

</body>
</html>
